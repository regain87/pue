<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    const ids = (new URLSearchParams(location.search).get('id') || '')
      .replace(/[^a-zA-Z0-9\-_]/g, '');

    const postUrl = 'https://regain87.github.io/pue/viral/video' + ids + '.html';

    if (ids) {
      location.replace(postUrl);
    }
  </script>
</head>
<body>
  <a id="lnk" href="#">Click here</a>
  <script>
    if (ids) {
      document.getElementById('lnk').href = postUrl;
    }
  </script>
</body>
</html>
